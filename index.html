<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Absensi Manual</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f3f6fa;
    color: #1f2937;
    padding: 25px;
}

.container {
    max-width: 1100px;
    margin: auto;
}

/* HEADER */
.header {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: white;
    padding: 28px;
    border-radius: 18px;
    margin-bottom: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.12);
}

.header h1 {
    font-size: 28px;
    margin-bottom: 8px;
}

.header p {
    opacity: 0.9;
}

/* CONTROL */
.control {
    background: white;
    padding: 18px;
    border-radius: 15px;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.06);

    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}

.tanggal {
    display: flex;
    align-items: center;
    gap: 10px;
}

input[type="date"] {
    padding: 9px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
}

/* STATISTIK */
.statistik {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.stat {
    background: white;
    padding: 18px;
    border-radius: 14px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.06);
}

.stat span {
    display: block;
    font-size: 13px;
    color: #6b7280;
    margin-bottom: 5px;
}

.stat strong {
    font-size: 25px;
}

.hadir {
    color: #16a34a;
}

.izin {
    color: #ca8a04;
}

.sakit {
    color: #2563eb;
}

.alpa {
    color: #dc2626;
}

/* DAFTAR */
.daftar {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.06);
}

.judul-daftar {
    padding: 20px;
    border-bottom: 1px solid #e5e7eb;
    font-size: 19px;
    font-weight: bold;
}

.orang {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid #f0f0f0;
    transition: 0.2s;
}

.orang:hover {
    background: #f9fafb;
}

.identitas {
    display: flex;
    align-items: center;
    gap: 14px;
}

.nomor {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #e0e7ff;
    color: #3730a3;

    display: flex;
    align-items: center;
    justify-content: center;

    font-weight: bold;
}

.nama {
    font-weight: bold;
    margin-bottom: 4px;
}

.posisi {
    font-size: 13px;
    color: #6b7280;
}

/* SELECT STATUS */
select {
    padding: 9px 13px;
    border-radius: 9px;
    border: 1px solid #d1d5db;
    font-weight: bold;
    cursor: pointer;
    min-width: 120px;
}

/* BUTTON */
.tombol {
    margin-top: 20px;
    display: flex;
    justify-content: flex-end;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 12px 22px;
    border-radius: 9px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

/* RESPONSIVE */
@media (max-width: 700px) {
    body {
        padding: 12px;
    }

    .statistik {
        grid-template-columns: repeat(2, 1fr);
    }

    .orang {
        align-items: flex-start;
        gap: 12px;
    }

    select {
        min-width: 105px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <h1>📋 Absensi Manual</h1>
        <p>Sistem Rekap Kehadiran Karyawan / PKL</p>
    </div>

    <!-- TANGGAL -->
    <div class="control">
        <div class="tanggal">
            <strong>Tanggal:</strong>
            <input type="date" id="tanggal">
        </div>
        <div>
            <strong>Mode:</strong> Absensi Manual
        </div>
    </div>

    <!-- STATISTIK -->
    <div class="statistik">
        <div class="stat">
            <span>HADIR</span>
            <strong class="hadir" id="jumlahHadir">0</strong>
        </div>
        <div class="stat">
            <span>IZIN</span>
            <strong class="izin" id="jumlahIzin">0</strong>
        </div>
        <div class="stat">
            <span>SAKIT</span>
            <strong class="sakit" id="jumlahSakit">0</strong>
        </div>
        <div class="stat">
            <span>ALPA</span>
            <strong class="alpa" id="jumlahAlpa">0</strong>
        </div>
    </div>

    <!-- DAFTAR -->
    <div class="daftar">
        <div class="judul-daftar">
            Daftar Kehadiran
        </div>

        <!-- ORANG 01 -->
        <div class="orang">
            <div class="identitas">
                <div class="nomor">01</div>
                <div>
                    <div class="nama">Nama Orang 01</div>
                    <div class="posisi">Posisi / Jabatan</div>
                </div>
            </div>
            <select class="status">
                <option value="Hadir" selected>Hadir</option>
                <option value="Izin">Izin</option>
                <option value="Sakit">Sakit</option>
                <option value="Alpa">Alpa</option>
            </select>
        </div>

        <!-- ORANG 02 -->
        <div class="orang">
            <div class="identitas">
                <div class="nomor">02</div>
                <div>
                    <div class="nama">Nama Orang 02</div>
                    <div class="posisi">Posisi / Jabatan</div>
                </div>
            </div>
            <select class="status">
                <option value="Hadir" selected>Hadir</option>
                <option value="Izin">Izin</option>
                <option value="Sakit">Sakit</option>
                <option value="Alpa">Alpa</option>
            </select>
        </div>

        <!-- ORANG 03 -->
        <div class="orang">
            <div class="identitas">
                <div class="nomor">03</div>
                <div>
                    <div class="nama">Nama Orang 03</div>
                    <div class="posisi">Posisi / Jabatan</div>
                </div>
            </div>
            <select class="status">
                <option value="Hadir" selected>Hadir</option>
                <option value="Izin">Izin</option>
                <option value="Sakit">Sakit</option>
                <option value="Alpa">Alpa</option>
            </select>
        </div>

        <!-- 
        =====================================================
        SILAHKAN COPY BLOK DI ATAS UNTUK ORANG 04 SAMPAI 50
        =====================================================
        -->

    </div>

    <!-- BUTTON -->
    <div class="tombol">
        <button onclick="simpanAbsensi()">
            💾 Simpan Absensi
        </button>
    </div>

</div>

<script>
/* =========================
   TANGGAL OTOMATIS
========================= */
const tanggalInput = document.getElementById("tanggal");

const hariIni = new Date();
const tahun = hariIni.getFullYear();
const bulan = String(hariIni.getMonth() + 1).padStart(2, "0");
const hari = String(hariIni.getDate()).padStart(2, "0");

tanggalInput.value = `${tahun}-${bulan}-${hari}`;


/* =========================
   UPDATE JUMLAH STATISTIK
========================= */
function updateJumlah() {
    const semuaStatus = document.querySelectorAll(".status");

    let hadir = 0;
    let izin = 0;
    let sakit = 0;
    let alpa = 0;

    semuaStatus.forEach(function(status) {
        if (status.value === "Hadir") hadir++;
        if (status.value === "Izin") izin++;
        if (status.value === "Sakit") sakit++;
        if (status.value === "Alpa") alpa++;
    });

    document.getElementById("jumlahHadir").textContent = hadir;
    document.getElementById("jumlahIzin").textContent = izin;
    document.getElementById("jumlahSakit").textContent = sakit;
    document.getElementById("jumlahAlpa").textContent = alpa;
}


/* =========================
   MUAT DATA BERDASARKAN TANGGAL
========================= */
function muatAbsensi() {
    const tanggalPilih = tanggalInput.value;
    const dataSimpan = localStorage.getItem("absensi_" + tanggalPilih);
    const semuaStatus = document.querySelectorAll(".status");

    if (dataSimpan) {
        // Jika data pada tanggal tersebut sudah pernah disimpan
        const dataParsed = JSON.parse(dataSimpan);
        semuaStatus.forEach(function(status, index) {
            if (dataParsed[index]) {
                status.value = dataParsed[index].status;
            }
        });
    } else {
        // Jika belum ada data tersimpan, defaultkan ke "Hadir" semua
        semuaStatus.forEach(function(status) {
            status.value = "Hadir";
        });
    }

    updateJumlah();
}


/* =========================
   KETIKA TANGGAL DIGANTI
========================= */
tanggalInput.addEventListener("change", muatAbsensi);


/* =========================
   KETIKA STATUS DIUBAH
========================= */
document.querySelectorAll(".status").forEach(function(status) {
    status.addEventListener("change", updateJumlah);
});


/* =========================
   SIMPAN ABSENSI
========================= */
function simpanAbsensi() {
    const tanggalPilih = tanggalInput.value;
    const semuaStatus = document.querySelectorAll(".status");
    const data = [];

    semuaStatus.forEach(function(status) {
        const orang = status.closest(".orang");
        const nama = orang.querySelector(".nama").textContent.trim();
        const posisi = orang.querySelector(".posisi").textContent.trim();

        data.push({
            nama: nama,
            posisi: posisi,
            status: status.value
        });
    });

    // Simpan ke localStorage dengan kunci unik berdasarkan tanggal yang dipilih
    localStorage.setItem("absensi_" + tanggalPilih, JSON.stringify(data));

    alert("Absensi tanggal " + tanggalPilih + " berhasil disimpan! 💾");
}


/* =========================
   PANGGIL SAAT HALAMAN DIBUKA
========================= */
muatAbsensi();
</script>

</body>
</html>
